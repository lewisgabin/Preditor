name: quinielalab

x-api-environment: &api-environment
  APP_NAME: QuinielaLab
  APP_ENV: local
  # Clave publica y determinista solo para desarrollo local; nunca usar en produccion.
  APP_KEY: ${APP_KEY:-base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
  APP_DEBUG: "true"
  APP_URL: http://localhost:8080
  APP_TIMEZONE: America/Santo_Domingo
  APP_VERSION: local
  GIT_SHA: local
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: quinielalab
  DB_USERNAME: quinielalab
  DB_PASSWORD: local_only_password
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  LOTTERY_API_ENABLED: ${LOTTERY_API_ENABLED:-false}
  LOTTERY_API_PROVIDER: ${LOTTERY_API_PROVIDER:-fake}
  LOTTERY_SYNC_PROVIDER: ${LOTTERY_SYNC_PROVIDER:-${LOTTERY_API_PROVIDER:-fake}}
  LOTTERY_SYNC_AUTOMATIC_ENABLED: ${LOTTERY_SYNC_AUTOMATIC_ENABLED:-false}
  LOTTERY_API_BASE_URL: ${LOTTERY_API_BASE_URL:-}
  LOTTERY_API_ENDPOINT_TEMPLATE: ${LOTTERY_API_ENDPOINT_TEMPLATE:-}
  LOTTERY_API_KEY: ${LOTTERY_API_KEY:-}
  LOTTERY_API_TIMEOUT_SECONDS: ${LOTTERY_API_TIMEOUT_SECONDS:-10}
  LOTTERY_API_CONNECT_TIMEOUT_SECONDS: ${LOTTERY_API_CONNECT_TIMEOUT_SECONDS:-5}
  LOTTERY_API_RETRY_ATTEMPTS: ${LOTTERY_API_RETRY_ATTEMPTS:-3}
  LOTTERY_API_RETRY_BACKOFF_SECONDS: ${LOTTERY_API_RETRY_BACKOFF_SECONDS:-5}
  LOTTERY_API_LOOKBACK_DAYS: ${LOTTERY_API_LOOKBACK_DAYS:-1}
  LOTTERY_API_RECONCILIATION_DAYS: ${LOTTERY_API_RECONCILIATION_DAYS:-3}
  # Una cookie host-only funciona tanto con localhost como con 127.0.0.1.
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173,localhost:5174,127.0.0.1:5174,localhost:8080,127.0.0.1:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

x-api-service: &api-service
  build:
    context: .
    dockerfile: infra/docker/api/Dockerfile
    target: runtime
  image: quinielalab-api:local
  environment: *api-environment
  restart: unless-stopped
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quinielalab
      MYSQL_USER: quinielalab
      MYSQL_PASSWORD: local_only_password
      MYSQL_ROOT_PASSWORD: root_local_only_password
      TZ: America/Santo_Domingo
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local_only_password"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api-service

  horizon:
    <<: *api-service
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 5s
      retries: 8

  scheduler:
    <<: *api-service
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 3s
      retries: 3

  api-nginx:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: nginx
    image: quinielalab-api-nginx:local
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on:
      api: { condition: service_healthy }
      scheduler: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    image: quinielalab-web:local
    restart: unless-stopped
    ports: ["${WEB_PORT:-5173}:8080"]
    depends_on:
      api-nginx: { condition: service_healthy }

volumes:
  mysql_data:
  redis_data:
