name: quinielalab-prod

x-api-environment: &api-environment
  APP_NAME: QuinielaLab
  APP_ENV: production
  APP_KEY: ${APP_KEY:?Set APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?Set APP_URL}
  APP_TIMEZONE: America/Santo_Domingo
  APP_VERSION: ${APP_VERSION:-production}
  GIT_SHA: ${GIT_SHA:-latest}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?Set DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  REDIS_CLIENT: predis
  REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: ${REDIS_PORT:-6379}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "true"
  SESSION_DOMAIN: ${SESSION_DOMAIN:?Set SESSION_DOMAIN}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?Set SANCTUM_STATEFUL_DOMAINS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}

x-api-service: &api-service
  build:
    context: .
    dockerfile: infra/docker/api/Dockerfile
    target: runtime
  image: ${API_IMAGE:-quinielalab-api}:${IMAGE_TAG:-latest}
  environment: *api-environment
  restart: unless-stopped

services:
  api:
    <<: *api-service

  horizon:
    <<: *api-service
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 5s
      retries: 8

  scheduler:
    <<: *api-service
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 3s
      retries: 3

  api-nginx:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: nginx
    image: ${API_NGINX_IMAGE:-quinielalab-api-nginx}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["8080"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    image: ${WEB_IMAGE:-quinielalab-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["8080"]
    depends_on:
      api-nginx: { condition: service_healthy }
