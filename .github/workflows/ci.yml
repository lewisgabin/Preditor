name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: quinielalab_test
          MYSQL_USER: quinielalab
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: root_test_only_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_only_password"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          working-directory: apps/api
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=512M
      - run: php artisan test
        env:
          DB_PORT: 3306
          REDIS_PORT: 6379

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  containers-and-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E2E_EMAIL: owner.e2e@example.test
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_API_URL: http://127.0.0.1:8080
      IMAGE_TAG: ${{ github.sha }}
      WEB_PORT: 5173
      LOTTERY_API_ENABLED: true
      LOTTERY_API_PROVIDER: fake
      LOTTERY_SYNC_PROVIDER: fake
      LOTTERY_SYNC_AUTOMATIC_ENABLED: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: docker compose build
      - run: docker compose up -d mysql redis
      - run: docker compose run --rm api php artisan migrate --isolated --force
      - run: docker compose up -d --wait
      - name: Crear propietario E2E efímero
        run: |
          password="Phase0-$(openssl rand -hex 12)!"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          printf '%s' "$password" | docker compose exec -T api php artisan app:create-owner --name="Propietario E2E" --email="$E2E_EMAIL" --password-stdin
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Esperar SPA
        run: ./scripts/wait-for-health.sh "$E2E_BASE_URL/"
      - name: Esperar API
        run: ./scripts/wait-for-health.sh "$E2E_API_URL/api/health"
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Validar imágenes de producción etiquetables por SHA
        env:
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          APP_URL: https://api.example.test
          DB_HOST: mysql.example
          DB_DATABASE: quinielalab
          DB_USERNAME: quinielalab
          DB_PASSWORD: placeholder
          REDIS_HOST: redis.example
          SESSION_DOMAIN: .example.test
          SANCTUM_STATEFUL_DOMAINS: app.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
        run: docker compose -f docker-compose.prod.yml build
      - if: always()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down --volumes
