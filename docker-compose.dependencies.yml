name: quinielalab-dependencies

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quinielalab_test
      MYSQL_USER: quinielalab
      MYSQL_PASSWORD: test_only_password
      MYSQL_ROOT_PASSWORD: root_test_only_password
      TZ: America/Santo_Domingo
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_test_only_password"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_test_data:
  redis_test_data:
